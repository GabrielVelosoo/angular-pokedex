<div class="card-container">
  <input type="text" (input)="getPokemon($any($event.target).value)" >

  <div class="card-title">
    <h3> {{ pokemon.name }} </h3>
  </div>

  <div class="card-body">
    <img [src]="pokemon.sprites.front_default" height="150px" alt="pokemon">
  </div>

  <div class="card-stats">
    <span
      *ngFor="let t of pokemon.types"
      class="card-stats-type"
    >
        {{ t.type.name }}
    </span>
  </div>
</div>
